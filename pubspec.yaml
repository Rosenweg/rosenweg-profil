name: rosenweg_profil
description: "Rosenweg Profil: die eigenen Angaben im Rosenweg-Portal."
publish_to: 'none'

# Version x.y.z+n: n wird zur Android-versionCode und zur Debian-Revision
# (linux/paket/bauen.sh). Fuer ein neues Paket n anheben.
version: 0.1.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Gemeinsame Basis der Rosenweg-Apps (Anmeldung, API-Client, Thema, Rahmen)
  # aus dem privaten Repo Rosenweg/rosenweg-basis. Fester Stand: main nach
  # #5 (Anmeldeschirm aus commons-rosenweg) und #8; noch ohne Tag, darum der
  # Commit. Sobald v0.3.0 getaggt ist, auf den Tag umstellen. Lokal gegen den
  # Nachbarordner entwickeln: pubspec_overrides.yaml (nicht eingecheckt,
  # siehe README).
  rosenweg_basis:
    git:
      url: https://github.com/Rosenweg/rosenweg-basis.git
      ref: 22ea4ba1d8f8908b4a8f47b987c5458b571e3bcc
  file_selector: ^1.1.0
  image: ^4.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/rosenweg-profil-512.png
