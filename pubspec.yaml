name: rosenweg_profil
description: "Rosenweg Profil: die eigenen Angaben im Rosenweg-Portal."
publish_to: 'none'

# Version x.y.z+n: n wird zur Android-versionCode und zur Debian-Revision
# (linux/paket/bauen.sh). Fuer ein neues Paket n anheben.
version: 0.1.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Gemeinsame Basis aller Rosenweg-Apps. Bis das Repo freigegeben ist, kommt
  # sie aus dem Nachbarordner: pubspec_overrides.yaml (nicht eingecheckt),
  # siehe README "Bauen".
  rosenweg_basis:
    git:
      url: https://github.com/Rosenweg/rosenweg-basis.git
      # Anmeldeschirm aus commons-rosenweg (rosenweg-basis#5); nach dem Merge auf den Tag umstellen
      ref: karten-anmeldung
  file_selector: ^1.1.0
  image: ^4.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/rosenweg-profil-512.png
